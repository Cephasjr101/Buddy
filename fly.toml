# fly.toml app configuration file generated for buddy-ymc-pw on 2026-11-11T12:53:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buddy-ymc-pw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[[mounts]]
  source = 'agenthubdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
